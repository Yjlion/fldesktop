name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  arch:
    name: Arch Linux (wlroots 0.20)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja pkgconf wayland-protocols \
            fltk wlroots0.20 libvterm pango cairo libinput libxkbcommon pixman shared-mime-info \
            glib2 libpipewire polkit libnm fontconfig xkeyboard-config ttf-dejavu \
            libcups packagekit flatpak appstream mpv wtype dbus python-dbusmock xdg-desktop-portal
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
      - name: Test
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          ctest --test-dir build --output-on-failure

  debian:
    name: Debian trixie (wlroots 0.18)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper git ca-certificates cmake ninja-build pkgconf \
            libfltk1.4-dev libwlroots-0.18-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libinput-dev libpango1.0-dev libcairo2-dev libdrm-dev libpixman-1-dev libvterm-dev \
            libglib2.0-dev libpipewire-0.3-dev libpolkit-agent-1-dev libnm-dev libfontconfig-dev \
            libcups2-dev libpackagekit-glib2-dev libflatpak-dev libappstream-dev libmpv-dev libegl-dev libgl-dev libpam0g-dev \
            xkb-data shared-mime-info wtype dbus-daemon dbus-bin libglib2.0-bin python3-dbusmock xdg-desktop-portal
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          export XDG_RUNTIME_DIR=$(mktemp -d)
          ctest --test-dir build --output-on-failure

  # packages for reviewers; pushes to main and tags publish them (repo.yml)
  packages:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/packages.yml
    with:
      channel: devel
