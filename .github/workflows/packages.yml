name: Packages

# Builds the Debian and Arch packages. Called by ci.yml (pull requests) and
# repo.yml (publishing); can also be started by hand.
on:
  workflow_call:
    inputs:
      channel:
        description: "stable (version from debian/changelog) or devel (version + git count)"
        type: string
        default: devel
  workflow_dispatch:
    inputs:
      channel:
        description: "stable or devel"
        type: choice
        options: [devel, stable]
        default: devel

jobs:
  debian:
    name: Debian trixie (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            # also builds the architecture independent packages
            build: -b
          - arch: arm64
            runner: ubuntu-24.04-arm
            build: -B
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    env:
      DEBEMAIL: yjlion@users.noreply.github.com
      DEBFULLNAME: Yjlion
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper git ca-certificates cmake ninja-build pkgconf \
            libfltk1.4-dev libwlroots-0.18-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libinput-dev libpango1.0-dev libcairo2-dev librsvg2-dev libdrm-dev libpixman-1-dev libvterm-dev \
            libglib2.0-dev libpipewire-0.3-dev libpolkit-agent-1-dev libnm-dev libssl-dev libfontconfig-dev \
            libcups2-dev libpackagekit-glib2-dev libflatpak-dev libappstream-dev libjxl-dev libarchive-dev libwpewebkit-2.0-dev libwpe-1.0-dev libwpebackend-fdo-1.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libegl-dev libgl-dev libpam0g-dev \
            xkb-data shared-mime-info lintian
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set the version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          git config --global --add safe.directory "$PWD"
          cp -r packaging/debian debian
          # the release tag (stable) or the latest tag + git count (devel) is the version
          eval "$(packaging/version.sh "$CHANNEL")"
          if [ "$CHANNEL" = stable ]; then
            dist=trixie msg="Release $FLD_DEB_VERSION (tag ${GITHUB_REF_NAME})."
          else
            dist=trixie-devel msg="Development build of $(git rev-parse --short=7 HEAD)."
          fi
          dch -b --newversion "$FLD_DEB_VERSION" --distribution "$dist" --force-distribution "$msg"
          dpkg-parsechangelog -S Version
      - name: Build
        run: |
          dpkg-buildpackage ${{ matrix.build }} -us -uc
          mkdir -p dist && mv ../*.deb dist/
          ls -l dist
      - name: Lintian
        run: lintian --no-tag-display-limit dist/*.deb || true
      - uses: actions/upload-artifact@v4
        with:
          name: debian-trixie-${{ matrix.arch }}
          path: dist/*.deb

  arch:
    name: Arch Linux (x86_64)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja pkgconf wayland-protocols \
            fltk wlroots0.20 libvterm pango cairo librsvg libinput libxkbcommon pixman shared-mime-info \
            glib2 libpipewire polkit libnm fontconfig xkeyboard-config ttf-dejavu \
            libcups packagekit flatpak appstream libjxl libarchive wpewebkit gstreamer gst-plugins-base gst-plugins-good
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set the version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          git config --global --add safe.directory "$PWD"
          # the release tag (stable) or the latest tag + git count (devel) is the version
          eval "$(packaging/version.sh "$CHANNEL")"
          echo "FLD_PKGVER=$FLD_PKGVER" >> "$GITHUB_ENV"
          sed -i "s/^pkgrel=.*/pkgrel=$FLD_PKGREL/" packaging/arch/PKGBUILD
          echo "pkgver=$FLD_PKGVER pkgrel=$FLD_PKGREL"
      - name: Build
        run: |
          useradd -m builder
          chown -R builder .
          su builder -c "git config --global --add safe.directory '*'"
          su builder -c "cd packaging/arch && FLD_PKGVER=$FLD_PKGVER FLDESKTOP_SRC=$PWD makepkg --nodeps --noconfirm"
          mkdir -p dist && cp packaging/arch/*.pkg.tar.zst dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: dist/*.pkg.tar.zst
