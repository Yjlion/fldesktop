# Portal backends for XDG_CURRENT_DESKTOP=fldesktop (xdg-desktop-portal >= 1.17).
# fl implements file chooser, app chooser, settings, screenshot, access,
# account, notification, wallpaper, screen casting (with
# xdg-desktop-portal-wlr as a fallback), remote desktop, inhibit, background,
# global shortcuts and print; everything else comes from the GTK backend if
# installed.
[preferred]
default=fl;gtk;
org.freedesktop.impl.portal.ScreenCast=fl;wlr;
org.freedesktop.impl.portal.RemoteDesktop=fl;
org.freedesktop.impl.portal.Secret=gnome-keyring;
