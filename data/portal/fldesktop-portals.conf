# Portal backends for XDG_CURRENT_DESKTOP=fldesktop (xdg-desktop-portal >= 1.17).
# fl implements file chooser, app chooser, settings, screenshot, access,
# account, notification and wallpaper; screen casting comes from
# xdg-desktop-portal-wlr, everything else from the GTK backend if installed.
[preferred]
default=fl;gtk;
org.freedesktop.impl.portal.ScreenCast=wlr;
org.freedesktop.impl.portal.RemoteDesktop=none;
org.freedesktop.impl.portal.Secret=gnome-keyring;
